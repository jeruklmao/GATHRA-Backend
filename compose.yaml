name: gathra-routing

services:
  routing-engine:
    build:
      context: ./routing-engine
      args:
        GRAPH_HOPPER_VERSION: "11.0"
    environment:
      JAVA_OPTS: >-
        ${GRAPH_HOPPER_JAVA_OPTS:--Xms256m -Xmx1g}
        -Ddw.graphhopper.prepare.min_network_size=${GRAPH_HOPPER_MIN_NETWORK_SIZE:-0}
    volumes:
      - "${GATHRA_OSM_FILE:-./routing-engine/fixtures/jakarta-sample.osm}:/data/region.osm:ro"
      - graphhopper-cache:/data/graph-cache
    expose:
      - "8989"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8989/info"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
    environment:
      NODE_ENV: production
      PORT: "3000"
      ROUTING_ENGINE_BASE_URL: "http://routing-engine:8989"
      ROUTING_ENGINE_TIMEOUT_MS: "${ROUTING_ENGINE_TIMEOUT_MS:-8000}"
      GEOCODING_PROVIDER: "${GEOCODING_PROVIDER:-photon}"
      PHOTON_BASE_URL: "${PHOTON_BASE_URL:-http://photon:2322}"
      GEOCODING_PROVIDER_TIMEOUT_MS: "${GEOCODING_PROVIDER_TIMEOUT_MS:-2500}"
      GEOCODING_RATE_LIMIT: "${GEOCODING_RATE_LIMIT:-180}"
      GEOCODING_RATE_WINDOW_MS: "${GEOCODING_RATE_WINDOW_MS:-60000}"
      GEOCODING_REGION_CONFIG: "/app/geocoding/region/region-config.json"
      ENABLE_DEV_FLOOD_ENDPOINTS: "${ENABLE_DEV_FLOOD_ENDPOINTS:-false}"
      ENABLE_FLOOD_ADMIN_ENDPOINTS: "${ENABLE_FLOOD_ADMIN_ENDPOINTS:-false}"
      FLOOD_ADMIN_TOKEN_SHA256: "${FLOOD_ADMIN_TOKEN_SHA256:-}"
      MAX_ACTIVE_FLOOD_HAZARDS: "${MAX_ACTIVE_FLOOD_HAZARDS:-50}"
      MAX_FLOOD_POLYGON_VERTICES: "${MAX_FLOOD_POLYGON_VERTICES:-2000}"
    depends_on:
      routing-engine:
        condition: service_healthy
      photon:
        condition: service_healthy
    networks:
      - default
      - geocoding-private
    volumes:
      - "./geocoding/region/region-config.json:/app/geocoding/region/region-config.json:ro"
    ports:
      - "${GATHRA_BACKEND_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  photon:
    build:
      context: ./photon
      args:
        PHOTON_VERSION: "0.5.0"
        PHOTON_SHA256: "3d1c167065a3d0b86a3359598e3beed3b735477c95b674ec4e913244d0fd6c9b"
    environment:
      JAVA_TOOL_OPTIONS: "${PHOTON_JAVA_OPTS:--Xms128m -Xmx384m}"
    expose:
      - "2322"
    volumes:
      - photon-data:/photon/photon_data
    networks:
      - geocoding-private
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:2322/api?q=Jakarta&limit=1&bbox=106.479,-6.437,106.955,-6.025"
        ]
      interval: 5s
      timeout: 4s
      retries: 60
      start_period: 30s
    mem_limit: "${PHOTON_MEMORY_LIMIT:-512m}"
    cpus: "${PHOTON_CPUS:-1.5}"
    restart: unless-stopped

volumes:
  graphhopper-cache:
  photon-data:
    external: true
    name: "${PHOTON_DATA_VOLUME:-gathra-routing_photon-data}"

networks:
  geocoding-private:
    internal: true
