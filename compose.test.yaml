name: gathra-backend-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gathra_test
      POSTGRES_USER: gathra_test
      POSTGRES_PASSWORD: gathra-test-only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gathra_test -d gathra_test"]
      interval: 2s
      timeout: 2s
      retries: 30
